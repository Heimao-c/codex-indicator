name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[build]"
      - name: Build tray and hook executables
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name CodexIndicator --paths src --collect-submodules pystray --add-data "src/codex_indicator/assets;codex_indicator/assets" src/codex_indicator/__main__.py
          pyinstaller --noconfirm --clean --console --onedir --name CodexIndicatorHook --paths src --collect-submodules pystray --add-data "src/codex_indicator/assets;codex_indicator/assets" src/codex_indicator/__main__.py
          if (-not (Test-Path dist/CodexIndicator/CodexIndicator.exe)) { throw "Tray executable was not built" }
          & dist/CodexIndicatorHook/CodexIndicatorHook.exe --version
          New-Item -ItemType Directory -Path bundle
          Move-Item dist/CodexIndicator bundle/CodexIndicator
          Move-Item dist/CodexIndicatorHook bundle/CodexIndicatorHook
          Compress-Archive -Path bundle/* -DestinationPath codex-indicator-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: codex-indicator-windows-x64
          path: codex-indicator-windows-x64.zip

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[build]"
      - name: Build menu-bar app and hook executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name CodexIndicator --paths src --collect-submodules pystray --add-data "src/codex_indicator/assets:codex_indicator/assets" src/codex_indicator/__main__.py
          pyinstaller --noconfirm --clean --console --onedir --name CodexIndicatorHook --paths src --collect-submodules pystray --add-data "src/codex_indicator/assets:codex_indicator/assets" src/codex_indicator/__main__.py
          test -d dist/CodexIndicator.app
          dist/CodexIndicatorHook/CodexIndicatorHook --version
          mkdir bundle
          mv dist/CodexIndicator.app bundle/
          mv dist/CodexIndicatorHook bundle/
          ditto -c -k --sequesterRsrc --keepParent bundle codex-indicator-macos-${{ matrix.architecture }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: codex-indicator-macos-${{ matrix.architecture }}
          path: codex-indicator-macos-${{ matrix.architecture }}.zip

  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deb
        run: sh scripts/build-deb.sh "${GITHUB_REF_NAME#v}" amd64
      - uses: actions/upload-artifact@v4
        with:
          name: codex-indicator-ubuntu-amd64
          path: dist/*.deb

  publish:
    needs: [build-windows, build-macos, build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-indicator-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
