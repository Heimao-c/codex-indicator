name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile all modules
        run: python -m compileall -q src
      - name: CLI doctor
        run: python -m codex_indicator --doctor

  ubuntu-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deb
        run: sh scripts/build-deb.sh 0.4.1 amd64
      - name: Inspect deb
        run: |
          dpkg-deb --info dist/cc-indicator_0.4.1_amd64.deb
          dpkg-deb --contents dist/cc-indicator_0.4.1_amd64.deb

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[build]"
      - name: Build and smoke-test executables
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name CCIndicator --paths src --collect-submodules pystray --add-data "src/codex_indicator/assets;codex_indicator/assets" src/codex_indicator/__main__.py
          pyinstaller --noconfirm --clean --console --onedir --name CCIndicatorHook --paths src --collect-submodules pystray --add-data "src/codex_indicator/assets;codex_indicator/assets" src/codex_indicator/__main__.py
          if (-not (Test-Path dist/CCIndicator/CCIndicator.exe)) { throw "Tray executable was not built" }
          & dist/CCIndicatorHook/CCIndicatorHook.exe --version

  macos-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[build]"
      - name: Build and smoke-test application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name CCIndicator --paths src --collect-submodules pystray --add-data "src/codex_indicator/assets:codex_indicator/assets" src/codex_indicator/__main__.py
          pyinstaller --noconfirm --clean --console --onedir --name CCIndicatorHook --paths src --collect-submodules pystray --add-data "src/codex_indicator/assets:codex_indicator/assets" src/codex_indicator/__main__.py
          test -d dist/CCIndicator.app
          dist/CCIndicatorHook/CCIndicatorHook --version
